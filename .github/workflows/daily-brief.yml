name: daily-brief
on:
  schedule:
    - cron: "0 3 * * 1-5"   # 03:00 UTC ~ 08:30 IST, Mon-Fri
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print instead of sending"
        type: boolean
        default: false

permissions:
  contents: write           # to commit updated history.parquet

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m marketbot.main --dry-run
          else
            python -m marketbot.main
          fi
      - name: Commit updated history + positions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.parquet data/positions.json
          git commit -m "data: update rolling history + positions [skip ci]" || echo "no changes"
          git pull --rebase --autostash || true
          git push || echo "nothing to push"
